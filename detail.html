<!DOCTYPE html>
<html lang="it">
<head>
  <title>Dettaglio Vincitore</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body style="font-family: sans-serif; background-color: #121212; color: #ffffff; padding: 40px; max-width: 800px; margin: auto;">
  
  <p><a href="index.html" style="color: #ffd700; text-decoration: none;">&larr; Torna alla lista</a></p>
  
  <div style="display: flex; align-items: center; gap: 50px; margin-top: 30px;">
    <div id="detail-canvas"></div>

    <div style="flex: 1;">
      <div id="edition-year" style="color: #888; font-size: 1.1rem; margin-bottom: 5px;">Anno</div>
      <h1 id="winner-name" style="color: #ffd700; font-size: 2.2rem; margin: 0 0 5px 0;">Caricamento...</h1>
      <div id="winner-country" style="color: #ccc; font-size: 1.1rem; margin-bottom: 25px;">Paese</div>

      <ul style="list-style: none; padding: 0; line-height: 2.2; font-size: 1rem; color: #fff;">
        <li><strong>Distanza percorsa:</strong> <span id="race-distance" style="color: #ff8c00;">—</span></li>
        <li><strong>Tempo impiegato:</strong> <span id="race-time" style="color: #00bfff;">—</span></li>
      </ul>
    </div>
  </div>

  <script src="detail.js"></script>
</body>
</html>
